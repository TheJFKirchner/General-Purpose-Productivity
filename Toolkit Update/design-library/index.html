  var ITEMS = [{"id":"FR-01","name":"title","type":"slide","from":"presentation","purpose":"Large headline, kicker above, one line below, no visual; for opening with the answer or the subject, or telling the audience who is presenting and when.","rel":"slides/FR-01-title.html","moves":false},{"id":"FR-02","name":"section-divider","type":"slide","from":"presentation","purpose":"Section name large, one line saying what the section will show; for marking a change of topic in a longer deck, or giving the audience a breath before a new line of argument.","rel":"slides/FR-02-section-divider.html","moves":false},{"id":"FR-03","name":"agenda-rows","type":"slide","from":"presentation","purpose":"Numbered rows: part name and one line each; for showing the route through a longer deck, or matching what is said to the sections in the bottom bar.","rel":"slides/FR-03-agenda-rows.html","moves":false},{"id":"FR-04","name":"goal-three-cards","type":"slide","from":"presentation","purpose":"Three cards side by side, the third tinted; for reminding the audience of the original goal, or laying out problem, action and measure of success in one view.","rel":"slides/FR-04-goal-three-cards.html","moves":false},{"id":"FR-05","name":"statement-quote","type":"slide","from":"presentation","purpose":"One sentence or quote in large type, source line under it; for making the audience hear one message with nothing competing, or letting a customer or stakeholder say it in their own words.","rel":"slides/FR-05-statement-quote.html","moves":false},{"id":"EX-01","name":"steps-flow","type":"slide","from":"presentation","purpose":"Three to five steps on a line, each with a title and one line; for showing a method or process in order, or showing a timeline or plan with the current point marked.","rel":"slides/EX-01-steps-flow.html","moves":false},{"id":"EX-02","name":"data-two-cards","type":"slide","from":"presentation","purpose":"Two cards: what was used (rows) and how it was checked (bullets); for showing what the analysis rests on and why it can be trusted, or answering scope and data-quality questions before they are asked.","rel":"slides/EX-02-data-two-cards.html","moves":false},{"id":"LV-01","name":"stats-three","type":"slide","from":"presentation","purpose":"Three large figures in a row, each with a label and a comparison note, one sentence under them, no chart; for landing two or three results at once, or showing results against target or prior without a chart.","rel":"slides/LV-01-stats-three.html","moves":false},{"id":"LV-02","name":"hero-number-line","type":"slide","from":"presentation","purpose":"One very large figure with its meaning in plain words, a line chart beside it; for making one number the whole message, or showing the figure and the path that led to it.","rel":"slides/LV-02-hero-number-line.html","moves":false},{"id":"LV-03","name":"hero-number-quote","type":"slide","from":"presentation","purpose":"One very large figure beside a one-sentence statement; for closing on the one thing to remember, or pairing a figure with the sentence that explains it.","rel":"slides/LV-03-hero-number-quote.html","moves":false},{"id":"LV-04","name":"stats-over-bars","type":"slide","from":"presentation","purpose":"Three figure cards across the top, a bar chart and two bullets under; for stating a position with its two inputs and the gap between them, or showing the headline figures and how one of them has moved.","rel":"slides/LV-04-stats-over-bars.html","moves":false},{"id":"LV-05","name":"bars-highlight-commentary","type":"slide","from":"presentation","purpose":"Vertical bars with one highlighted, commentary bullets and a so-what line on the right; for showing which category stands out, or comparing a handful of groups on one measure and saying why one differs.","rel":"slides/LV-05-bars-highlight-commentary.html","moves":false},{"id":"LV-06","name":"bars-ranked-commentary","type":"slide","from":"presentation","purpose":"Sorted horizontal bars with the leader highlighted, fuller commentary on the right; for ranking items when the labels are long, or showing which item drives a result.","rel":"slides/LV-06-bars-ranked-commentary.html","moves":false},{"id":"CH-01","name":"line-fit-commentary","type":"slide","from":"presentation","purpose":"Actual line with a dashed fitted line, commentary and so-what on the right; for showing a steady rate of change, or showing how closely actuals follow a fitted or expected path.","rel":"slides/CH-01-line-fit-commentary.html","moves":false},{"id":"CH-02","name":"line-event-callout","type":"slide","from":"presentation","purpose":"Callout with one figure and three bullets on the left; two lines with an event marked on the right; for showing the effect of a change against a group that did not change, or tying a movement to the moment that caused it.","rel":"slides/CH-02-line-event-callout.html","moves":false},{"id":"CH-03","name":"dots-two-fits","type":"slide","from":"presentation","purpose":"Commentary on the left; actual points with a longer and a shorter fitted line on the right; for asking whether a rate of change is speeding up or slowing, or comparing a long-run view with a recent view of the same measure.","rel":"slides/CH-03-dots-two-fits.html","moves":false},{"id":"CH-04","name":"bars-outlier-callout","type":"slide","from":"presentation","purpose":"One callout sentence over full-width bars with one period highlighted; for calling out an unusual period and how it was treated, or a lean slide for a senior audience: one sentence, one picture.","rel":"slides/CH-04-bars-outlier-callout.html","moves":false},{"id":"CH-05","name":"bars-before-after","type":"slide","from":"presentation","purpose":"Callout with the size of the change and two bullets; bars by period with the later periods highlighted; for showing a level shift after a change, or stating the size of an effect next to the evidence for it.","rel":"slides/CH-05-bars-before-after.html","moves":false},{"id":"CH-06","name":"two-charts-bullets","type":"slide","from":"presentation","purpose":"Two small line charts side by side, one muted and one highlighted, three bullets in a row under them; for splitting a result into two measures to show which one is moving, or showing that one thing is stable while another is not.","rel":"slides/CH-06-two-charts-bullets.html","moves":false},{"id":"CH-07","name":"change-cards-bars","type":"slide","from":"presentation","purpose":"Three stacked cards, each a change with its size and direction, beside a bar chart of the total at each review; for saying what is different since the audience last saw this, or listing a few changes with their sizes alongside the overall movement.","rel":"slides/CH-07-change-cards-bars.html","moves":false},{"id":"CP-01","name":"paired-bars-commentary","type":"slide","from":"presentation","purpose":"Paired bars by category (two series), commentary and so-what on the right; for comparing actual with expected across a few groups, or showing where two measures agree and where they part.","rel":"slides/CP-01-paired-bars-commentary.html","moves":false},{"id":"CP-02","name":"bars-target-tick","type":"slide","from":"presentation","purpose":"Horizontal bars with a tick marking the target for each, the miss highlighted; commentary on the right; for showing performance against a target or plan for each item, or picking out the one item that missed.","rel":"slides/CP-02-bars-target-tick.html","moves":false},{"id":"CP-03","name":"two-lines-fuller-commentary","type":"slide","from":"presentation","purpose":"Fuller commentary on the left, two lines over time on the right; for comparing our experience with a benchmark or peer, or a comparison meant to be read without a presenter.","rel":"slides/CP-03-two-lines-fuller-commentary.html","moves":false},{"id":"CP-04","name":"two-lines-choice-cards","type":"slide","from":"presentation","purpose":"Two lines over time, then one card per alternative with the chosen one tinted; for showing two approaches that give different answers and which was chosen, or explaining a judgement call between two views.","rel":"slides/CP-04-two-lines-choice-cards.html","moves":false},{"id":"CP-05","name":"dumbbell-callout","type":"slide","from":"presentation","purpose":"Full-width dumbbell chart (two points joined per category), one sentence under it; for showing movement between two points for several items at once, or showing which items moved most and in which direction.","rel":"slides/CP-05-dumbbell-callout.html","moves":false},{"id":"CP-06","name":"two-numbers-difference","type":"slide","from":"presentation","purpose":"Two large figures in cards with the difference stated between them, no chart; for a before and after, or an old and new, in one glance, or when the difference is the message and a chart would add nothing.","rel":"slides/CP-06-two-numbers-difference.html","moves":false},{"id":"CP-07","name":"table-key-row-commentary","type":"slide","from":"presentation","purpose":"Small table with one highlighted row, commentary and so-what beside it; for showing plan, actual and difference where exact figures will be read, or any small table where one row carries the point.","rel":"slides/CP-07-table-key-row-commentary.html","moves":false},{"id":"CP-08","name":"option-cards-recommendation","type":"slide","from":"presentation","purpose":"Two cards comparing options on the same rows, then the recommendation, no chart; for putting two options side by side on cost, benefit and risk, or leading the audience to a recommendation they can see the basis for.","rel":"slides/CP-08-option-cards-recommendation.html","moves":false},{"id":"BD-01","name":"waterfall-callout","type":"slide","from":"presentation","purpose":"Full-width vertical waterfall from one figure to another, one-sentence callout under it; for bridging from a starting figure to an ending figure by cause, or showing which driver accounts for most of a change.","rel":"slides/BD-01-waterfall-callout.html","moves":false},{"id":"BD-02","name":"waterfall-horizontal-commentary","type":"slide","from":"presentation","purpose":"Horizontal waterfall on the left, fuller commentary on the right; for building up a result from its components when labels are long, or a bridge that needs explaining step by step, readable without a presenter.","rel":"slides/BD-02-waterfall-horizontal-commentary.html","moves":false},{"id":"BD-03","name":"number-small-waterfall","type":"slide","from":"presentation","purpose":"Callout with one large figure and two bullets on the left, a three-bar waterfall on the right; for stating the effect of one decision and showing where it lands, or a simple from, change, to story.","rel":"slides/BD-03-number-small-waterfall.html","moves":false},{"id":"BD-04","name":"rows-plus-bars","type":"slide","from":"presentation","purpose":"Three numbered rows on the left, the same three effects as bars on the right; for splitting a change into a few named effects, or giving each effect a sentence and showing their relative size.","rel":"slides/BD-04-rows-plus-bars.html","moves":false},{"id":"BD-05","name":"stacked-mix-shift","type":"slide","from":"presentation","purpose":"Two 100% stacked bars, bullets and a callout under them; for showing how the make-up of a total shifted between two points, or showing that a result changed because the mix changed.","rel":"slides/BD-05-stacked-mix-shift.html","moves":false},{"id":"BD-06","name":"stats-over-stacked-bars","type":"slide","from":"presentation","purpose":"Three figures across the top, stacked horizontal bars by category, commentary beside; for splitting a total into two factors across several categories, or showing the headline figures and which category is behind them.","rel":"slides/BD-06-stats-over-stacked-bars.html","moves":false},{"id":"BD-07","name":"hero-number-donut","type":"slide","from":"presentation","purpose":"One very large figure in a callout with a two-part doughnut, no commentary; for showing that one part explains most of the whole, or a lean slide where a single share is the message.","rel":"slides/BD-07-hero-number-donut.html","moves":false},{"id":"BD-08","name":"table-bars-sensitivity","type":"slide","from":"presentation","purpose":"Small table and two bullets on the left, bars for each scenario on the right; for showing what the result becomes under different assumptions, or giving exact figures and their shape together.","rel":"slides/BD-08-table-bars-sensitivity.html","moves":false},{"id":"UN-01","name":"range-bar-commentary","type":"slide","from":"presentation","purpose":"One low-to-high range bar with the central and held figures marked, commentary under it; for showing where a chosen figure sits within a reasonable range, or making the size of the uncertainty visible.","rel":"slides/UN-01-range-bar-commentary.html","moves":false},{"id":"UN-02","name":"scenario-bars-caveats","type":"slide","from":"presentation","purpose":"Scenario bars on the left, four caveats and a so-what line on the right; for telling the audience what could change the answer before they decide, or sizing a few scenarios against the central view.","rel":"slides/UN-02-scenario-bars-caveats.html","moves":false},{"id":"DE-01","name":"summary-stats-ask","type":"slide","from":"presentation","purpose":"Answer as the headline, three large figures, the ask in a strip along the bottom; for an executive summary on one slide, or giving the answer, its support and the ask together.","rel":"slides/DE-01-summary-stats-ask.html","moves":false},{"id":"DE-02","name":"numbered-findings","type":"slide","from":"presentation","purpose":"Numbered rows, each a finding with its figure on the right; for listing the takeaways with their sizes, or listing risks or issues ranked by size.","rel":"slides/DE-02-numbered-findings.html","moves":false},{"id":"DE-03","name":"audience-rows","type":"slide","from":"presentation","purpose":"One row per audience group: who, what it means for them, the one figure; for translating a result for each group in the room, or showing each team what changes for them.","rel":"slides/DE-03-audience-rows.html","moves":false},{"id":"DE-04","name":"scorecard-status","type":"slide","from":"presentation","purpose":"Table with a status dot per row, one row highlighted, one line under it; for giving the status of several items at a glance, or showing which item needs attention.","rel":"slides/DE-04-scorecard-status.html","moves":false},{"id":"DE-05","name":"decision-two-paths","type":"slide","from":"presentation","purpose":"The decision in a callout, then one card for what happens if approved and one for if it waits; for asking for a decision and showing the consequence of each answer, or making the cost of delay explicit.","rel":"slides/DE-05-decision-two-paths.html","moves":false},{"id":"DE-06","name":"ask-and-actions","type":"slide","from":"presentation","purpose":"The decision needed in a callout on the left, rows of action, timing and owner on the right; for closing with the ask and who does what by when, or any decision followed by a short action list.","rel":"slides/DE-06-ask-and-actions.html","moves":false},{"id":"DE-07","name":"ask-and-timeline","type":"slide","from":"presentation","purpose":"A starting point in a callout over a five-step timeline with dates and owners; for showing the sequence of work that follows a decision, or a plan where order and dates matter more than detail.","rel":"slides/DE-07-ask-and-timeline.html","moves":false},{"id":"BK-01","name":"answer-with-bars","type":"slide","from":"presentation","purpose":"The answer as the headline; the question, a short answer and horizontal bars below; for answering a question the audience is likely to ask, or holding supporting evidence without lengthening the main story.","rel":"slides/BK-01-answer-with-bars.html","moves":false},{"id":"BK-02","name":"heatmap-callout","type":"slide","from":"presentation","purpose":"One callout sentence over a small heatmap grid with one diagonal highlighted; for showing a pattern across two dimensions, such as period by age, or pointing at one part of a grid of figures.","rel":"slides/BK-02-heatmap-callout.html","moves":false},{"id":"CT-02","name":"bars-ranked","type":"chart","from":"presentation","purpose":"Use to rank items on one measure when the labels are long, or to show which item drives a result, such as PMPM trend by service category; draws horizontal bars sorted largest first, the leader in blue, values at the bar ends and the overall figure as a reference line.","rel":"charts/CT-02-bars-ranked.html","moves":false},{"id":"CT-04","name":"line-fit","type":"chart","from":"presentation","purpose":"Use to show a steady rate of change, or how closely actuals follow a fitted or expected path, such as quarterly PMPM against a fitted annual trend; draws the actual line in blue, the latest period dashed as an estimate, and a dashed grey fitted line, both ends labelled.","rel":"charts/CT-04-line-fit.html","moves":false},{"id":"CT-06","name":"waterfall","type":"chart","from":"presentation","purpose":"Use to bridge from a starting figure to an ending figure by cause, or to show which driver accounts for most of a change, such as prior to current PMPM by trend component; draws a vertical bridge with the totals dark grey, the step that matters in blue and the other steps light grey.","rel":"charts/CT-06-waterfall.html","moves":false},{"id":"CT-07","name":"target-tick-bars","type":"chart","from":"presentation","purpose":"Use to show each item against its own target or plan and pick out the one item the reader must look at, a miss or a beat, such as loss ratio by product against target; draws horizontal bars with a dark tick at each target, the chosen item in blue with its value inside the bar.","rel":"charts/CT-07-target-tick-bars.html","moves":false},{"id":"CT-08","name":"dumbbell","type":"chart","from":"presentation","purpose":"Use to show movement between two points for several items at once, and which moved most and which way, such as loss ratio by product last year against this year to date; draws two dots per item joined by a short bar, the earlier grey, the later dark, the item that matters in blue.","rel":"charts/CT-08-dumbbell.html","moves":false},{"id":"CT-10","name":"heatmap-grid","type":"chart","from":"presentation","purpose":"Use to show a pattern across two dimensions or point at one part of a grid of figures, such as the latest diagonal of a claims development triangle; draws a small grid of figures on light grey cells, the cells that matter in blue with paper-coloured text.","rel":"charts/CT-10-heatmap-grid.html","moves":false},{"id":"CT-11","name":"range-bar","type":"chart","from":"presentation","purpose":"Use to show where a selected figure sits within a reasonable range and how wide the uncertainty is, such as the IBNR reserve against its low-to-high range; draws one grey bar from low to high on a value axis, the central estimate as a dashed line and the selected estimate as a solid blue line.","rel":"charts/CT-11-range-bar.html","moves":false},{"id":"CT-12","name":"year-overlay-lines","type":"chart","from":"design-library","purpose":"Use to read seasonality and the year-over-year gap at once, such as PMPM by incurred month for three years; draws one line per year across the calendar months, the current year in blue with its incomplete months dashed and the earlier years in greys.","rel":"charts/CT-12-year-overlay-lines.html","moves":false},{"id":"CT-13","name":"product-panels","type":"chart","from":"james-themes","purpose":"Use to compare several products over time without a tangle of lines, such as PMPM actual against expected by quarter; draws one small panel per product on a shared scale, actual against expected in each, with the A/E ratio in the panel title and the line coloured by whether it is over, under or within tolerance.","rel":"charts/CT-13-product-panels.html","moves":false},{"id":"CT-14","name":"bars-rate-dual-axis","type":"chart","from":"design-library","purpose":"Use to show two measures of different units for the same groups, such as PMPM and trend by product against the pricing trend; draws two side-by-side panels on one product axis, each with its own titled value axis, and puts every group past the reference in blue in both panels.","rel":"charts/CT-14-bars-rate-dual-axis.html","moves":false},{"id":"CT-15","name":"trend-decomp-bars","type":"chart","from":"design-library","purpose":"Use to show what drives each product's trend and where the drivers offset; draws horizontal bars per product split into unit cost, utilisation and mix, increases right of zero and decreases left, a tick at the net and the net trend in a right-hand column.","rel":"charts/CT-15-trend-decomp-bars.html","moves":false},{"id":"CT-16","name":"development-curves","type":"chart","from":"design-library","purpose":"Use to show how fast claims complete and whether recent months are paying slower or faster than a complete month; draws one cumulative curve per incurral month against months of run-out, a complete month as the grey reference, recent months stopping where their data ends and the latest projected to ultimate as a dashed line.","rel":"charts/CT-16-development-curves.html","moves":false},{"id":"CT-17","name":"ae-range-rows","type":"chart","from":"james-themes","purpose":"Use to show actual against expected by segment over time, fairly across segments of different size; draws one row per segment with its expected range as a grey bar around 100%, the last three quarters as hollow dots, the current quarter as a dashed estimate marker, and any value outside the range as a labelled diamond in the favourable or unfavourable colour.","rel":"charts/CT-17-ae-range-rows.html","moves":false},{"id":"CT-18","name":"cost-use-bubbles","type":"chart","from":"design-library","purpose":"Use to see which service categories drive one product's trend through price, through use, or both; draws bubbles placed by change in utilisation and change in unit cost, sized by PMPM with the PMPM printed on each label, quadrant labels and a diagonal at the pricing trend, the categories past it in blue.","rel":"charts/CT-18-cost-use-bubbles.html","moves":false},{"id":"CT-19","name":"mix-shift-columns","type":"chart","from":"james-themes","purpose":"Use to show how the make-up of spend changes over time, or that a result changed because the mix changed (two columns for two points), such as service category mix of PMPM; draws 100% stacked columns across several years, the shifting segment at the base in blue, the rest grey, shares inside, names at the right and the total level under each year.","rel":"charts/CT-19-mix-shift-columns.html","moves":false},{"id":"CT-20","name":"target-band-lines","type":"chart","from":"james-themes","purpose":"Use to show a rate against its target or assumption over time, such as loss ratio by product against target, or the effect of a change against a group that did not change; draws several lines against a shaded target range and a thin target line, the line that matters in blue, an event marked, the latest period dashed as an estimate and each line labelled at its end.","rel":"charts/CT-20-target-band-lines.html","moves":false},{"id":"CT-21","name":"paid-ibnr-bars","type":"chart","from":"james-themes","purpose":"Use for a monthly measure whose recent months are not yet complete, such as incurred PMPM with IBNR; draws bars by incurred month with the paid amount solid and the estimated unreported amount as a dashed, lighter cap, the total above each bar and last year as a dashed line.","rel":"charts/CT-21-paid-ibnr-bars.html","moves":false},{"id":"CT-22","name":"plan-drift-steps","type":"chart","from":"james-themes","purpose":"Use to show when a gap to budget started to open and how large it has grown; draws bars for each month's amount over or under budget, shaded by direction, with the running total as a dark step line, dashed where it includes an estimate, and its year-to-date figure and percent of budget labelled at the end.","rel":"charts/CT-22-plan-drift-steps.html","moves":false},{"id":"CT-23","name":"variance-split","type":"chart","from":"james-themes","purpose":"Use to show which groups are over or under plan and by how much, in dollars and as a percent of plan; draws horizontal bars around a zero line, over in the warning colour extending right, under in the favourable colour extending left, sorted, with the total as a last row.","rel":"charts/CT-23-variance-split.html","moves":false},{"id":"CT-24","name":"pareto-bars","type":"chart","from":"james-themes","purpose":"Use to show that a few drivers explain most of a total, such as large-claimant spend by condition; draws ranked bars with the leading few in blue, the claimant count under each name, and a running-share line on a second axis with an 80% reference.","rel":"charts/CT-24-pareto-bars.html","moves":false},{"id":"CT-27","name":"state-tiles","type":"chart","from":"james-themes","purpose":"Use to compare states fairly whatever their area, such as PMPM trend by state, without reading noise from small states; draws equal-size tiles laid out like a map of the US states, each shaded by its value in four steps of one colour, low-volume states outlined and unshaded, beside a readout of the overall, highest and lowest.","rel":"charts/CT-27-state-tiles.html","moves":false},{"id":"CT-28","name":"capsule-count","type":"chart","from":"james-themes","purpose":"Use to show that a small share of members carries a large share of spend; draws two blocks of 100 capsules side by side, one for members and one for allowed dollars, the high-cost group in blue in both, with a large figure under each.","rel":"charts/CT-28-capsule-count.html","moves":false},{"id":"CT-29","name":"rate-buildup-bridge","type":"chart","from":"design-library","purpose":"Use to walk a renewal from experience to the required premium and set it against the current premium and the proposed rate action; draws a PMPM bridge through trend, plan changes, the credibility blend with manual, administration and margin, with the current and proposed premiums as reference lines.","rel":"charts/CT-29-rate-buildup-bridge.html","moves":false},{"id":"CT-30","name":"rolling-12-panels","type":"chart","from":"design-library","purpose":"Use to show the run rate of a cost and its trend without the noise of single months, such as rolling 12-month PMPM and rolling 12-month trend; draws two stacked panels on one month axis, the level above and the trend percent below against the pricing trend, the months not yet complete shaded and dashed.","rel":"charts/CT-30-rolling-12-panels.html","moves":false},{"id":"CT-31","name":"tornado-fan","type":"chart","from":"design-library","purpose":"Use to show how uncertain a projection is and which assumptions move it most, such as projected PMPM for next year; draws a sensitivity tornado of each assumption's effect on the central estimate beside a fan of the projection with 50% and 90% ranges around the dashed central line.","rel":"charts/CT-31-tornado-fan.html","moves":false},{"id":"CT-32","name":"util-per-1000-panels","type":"chart","from":"design-library","purpose":"Use to compare utilisation per 1,000 members by service category against last year and a benchmark, each in its own unit; draws one small panel per category with last year and this year to date as bars, the benchmark as a line, and the change on each in the panel title, categories more than 5% over benchmark in blue.","rel":"charts/CT-32-util-per-1000-panels.html","moves":false},{"id":"CT-33","name":"stop-loss-excess","type":"chart","from":"design-library","purpose":"Use to show how often and how far large claimants pierce the specific stop-loss attachment, year by year, against the expected excess; draws bars of excess dollars above the attachment with the claimant count under each year and the expected excess as a dashed line, the latest year dashed as an estimate.","rel":"charts/CT-33-stop-loss-excess.html","moves":false},{"id":"TB-01","name":"ledger-meters","type":"table","from":"james-themes","purpose":"Paid and PMPM by service category against plan, each PMPM with an inline meter carrying a plan tick (over plan in the bad colour), the gap to plan in dollars and percent, the lead row marked and a CSV button; for a monthly or quarterly cost readout against plan.","rel":"tables/TB-01-ledger-meters.html","moves":false},{"id":"TB-02","name":"pivot-regroup","type":"table","from":"james-themes","purpose":"A pivot the reader regroups in place: pick what goes down the rows, across the columns and which measure fills the cells (paid, member months or PMPM, which is recomputed from the sums, never added), with row and column totals and a CSV of the current view.","rel":"tables/TB-02-pivot-regroup.html","moves":false},{"id":"TB-03","name":"development-triangle","type":"table","from":"design-library","purpose":"Cumulative paid claims by incurral month and lag with the latest diagonal boxed, age-to-age and completion factors in the footer, and the ultimate and IBNR each row implies; for setting or explaining a lag reserve.","rel":"tables/TB-03-development-triangle.html","moves":false},{"id":"TB-04","name":"experience-contribution","type":"table","from":"design-library","purpose":"PMPM by service category, prior against current, with trend split into utilisation and unit cost for every row and the total, each trend coloured against the pricing assumption and a centred bar for each category's points of the total trend; for explaining what drove cost trend.","rel":"tables/TB-04-experience-contribution.html","moves":false},{"id":"TB-05","name":"rate-walk","type":"table","from":"design-library","purpose":"A renewal rate build-up as a table: experience PMPM, then each adjustment with its basis, factor and signed dollar step, a running total that ties to the cent and an inline walk bar, ending in the required premium and the rate action against current; for showing how a renewal rate was reached.","rel":"tables/TB-05-rate-walk.html","moves":false},{"id":"TB-06","name":"large-claim-pooling","type":"table","from":"design-library","purpose":"Largest claimants ranked with paid amount, share and cumulative share of total paid, and the part above the pooling point, with the pooling point drawn through every bar and as a line in the table; for showing how few claimants drive a total and what pooling removes.","rel":"tables/TB-06-large-claim-pooling.html","moves":false},{"id":"TB-07","name":"heat-matrix-target","type":"table","from":"design-library","purpose":"Loss ratio by product and quarter with every cell shaded by its distance from target (good below, bad above, in three steps), over-target figures in bold so the reading survives greyscale, a premium-weighted year and total; for spotting where and when a book runs over target.","rel":"tables/TB-07-heat-matrix-target.html","moves":false},{"id":"TB-08","name":"monthly-experience","type":"table","from":"design-library","purpose":"Monthly experience by incurral month: member months, paid, IBNR, incurred, percent complete, PMPM against plan and the variance, with year-to-date and rolling-12 rows and months under 95% complete marked as estimates; for the regular monthly experience report.","rel":"tables/TB-08-monthly-experience.html","moves":false},{"id":"HC-01","name":"plan-tiles","type":"hero card","from":"james-themes","purpose":"Supporting measures as tiles against plan: the value, a bar to the plan tick and last year, a status top bar and note.","rel":"hero-cards/HC-01-plan-tiles.html","moves":false},{"id":"HC-02","name":"spotlight-tick","type":"hero card","from":"james-themes","purpose":"The page's one lead measure against its target: a large figure with its gap, a sentence saying why, a bar to the target tick and the basis; use it for the headline figure of a report or dashboard, such as loss ratio against target.","rel":"hero-cards/HC-02-spotlight-tick.html","moves":false},{"id":"HC-03","name":"split-strip","type":"hero card","from":"james-themes","purpose":"A figure with the parts that make it up, as one share strip and a key of values and shares; use it when a total such as PMPM or member months needs its split by service category or product beside it.","rel":"hero-cards/HC-03-split-strip.html","moves":false},{"id":"HC-04","name":"recent-range","type":"hero card","from":"james-themes","purpose":"A figure placed within its own recent range, as a marker on a track with the range shaded; use it for utilisation per 1,000 or any rate where the question is whether this period is unusual for it.","rel":"hero-cards/HC-04-recent-range.html","moves":false},{"id":"HC-05","name":"streak-months","type":"hero card","from":"james-themes","purpose":"How long a result has persisted, as a run of months marked favourable or unfavourable under the current streak; use it when the point is that claims have run above expected, or under target, for several months in a row.","rel":"hero-cards/HC-05-streak-months.html","moves":false},{"id":"HC-06","name":"rank-dots","type":"hero card","from":"james-themes","purpose":"Where one group stands among its peers, as its figure and a numbered row of rank positions with its own filled; use it when a region, product or plan needs to be placed against the others, such as second-highest PMPM of six regions.","rel":"hero-cards/HC-06-rank-dots.html","moves":false},{"id":"HC-07","name":"driver-sentence","type":"hero card","from":"james-themes","purpose":"One sentence naming the biggest driver of a change, on the band colour, with a strip showing its share of the total; use it beside the figure cards when the reader's next question is what caused the movement.","rel":"hero-cards/HC-07-driver-sentence.html","moves":false},{"id":"HC-08","name":"figure-trend-slate","type":"hero card","from":"james-themes","purpose":"A figure with its change on last year and a small this-year-against-last-year line under it in the same card; use it on a dashboard when the latest month's PMPM or utilisation needs its pat s where actuals stop and compares like with like; use for year-end projections.","rel":"animations/AN-04-projection-extend.html","moves":true},{"id":"AN-05","name":"triangle-fill","type":"animation","from":"design-library","purpose":"A paid claims development triangle that fills in one calendar diagonal at a time and ends on the latest diagonal highlighted, so the reader sees that each new month of payments adds one diagonal; use to explain lag triangles, run-out and IBNR.","rel":"animations/AN-05-triangle-fill.html","moves":true},{"id":"AN-06","name":"focus-recede","type":"animation","from":"design-library","purpose":"A plain bar chart in which, after a beat, one bar stays in colour and the rest recede to grey while the finding appears, so the room looks at the one category that matters; use when one category drives a change.","rel":"animations/AN-06-focus-recede.html","moves":true},{"id":"AN-07","name":"basis-morph","type":"animation","from":"james-themes","purpose":"Monthly claims by incurred month that start as paid to date, where recent months look low, then the IBNR estimate rises on top of each month to the completed view, so the reader sees the dip is unpaid claims, not lower cost; use when explaining paid against incurred and IBNR.","rel":"animations/AN-07-basis-morph.html","moves":true},{"id":"AN-08","name":"stack-regroup","type":"animation","from":"design-library","purpose":"A stacked column chart whose blocks slide from columns by product into columns by region, each block keeping its colour and label, so the reader follows the same pieces into the new grouping; use when one total has to be read two ways.","rel":"animations/AN-08-stack-regroup.html","moves":true},{"id":"AN-09","name":"slide-steps","type":"animation","from":"design-library","purpose":"A slide that reveals its headline, then its chart, then each of its two points on a step (Space or Enter, a click or the Next step button; it plays through once on load), so a presenter can talk to one thing   var TYPES = ['all'].concat(["slide","chart","table","hero card","animation","layout","theme"]);
  function get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* works without storage */ } }
  var current = get('design-library-theme', THEMES[0].id), type = get('design-library-type', 'all');
  var hash = (location.hash.match(/theme=([A-Z]{2}-[0-9]+)/) || [])[1]; if (hash) current = hash;
  var ht = (location.hash.match(/type=([a-z%0-9]+)/) || [])[1]; if (ht) type = decodeURIComponent(ht);
  if (!THEMES.some(function (t) { return t.id === current; })) current = THEMES[0].id;
  if (TYPES.indexOf(type) === -1) type = 'all';
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var pop = document.getElementById('pop'), frame = document.getElementById('pop-frame');
  function theme() { return THEMES.filter(function (t) { return t.id === current; })[0]; }
  function send(f, msg) { try { f.contentWindow.postMessage(msg, '*'); } catch (e) { /* not loaded yet */ } }
  /* the theme as sent to an item: its tokens and series, plus its embedded font faces when it has them */
  function full(t) { return t.font ? Object.assign({}, t.theme, { fonts: FONTS[t.font] }) : t.theme; }
  function sendTheme(f) { send(f, { theme: full(theme()) }); }
  function link(t) { return '#theme=' + encodeURIComponent(JSON.stringify(full(t))); }

  /* theme and type dropdowns */
  var ts = document.getElementById('theme'), ty = document.getElementById('type');
  THEMES.forEach(function (t) { var o = document.createElement('option'); o.value = t.id; o.textContent = t.id + ' ' + t.name; o.title = t.purpose; ts.appendChild(o); });
  TYPES.forEach(function (t) { var o = document.createElement('option'); o.value = t; o.textContent = t === 'all' ? 'All types' : t; ty.appendChild(o); });
  function applyTheme() {
    var t = theme(), r = document.documentElement;
    Object.keys(t.theme.css).forEach(function (k) { r.style.setProperty(k, t.theme.css[k]); });
    ts.value = t.id; ts.title = t.purpose;
    cards.forEach(function (c) { sendTheme(c.querySelector('iframe')); });
    var live = document.getElementById('theme-fonts-live');   /* the index itself takes the theme's font too */
    if (t.font) { if (!live) { live = document.createElement('style'); live.id = 'theme-fonts-live'; document.head.appendChild(live); } if (live.textContent !== FONTS[t.font]) live.textContent = FONTS[t.font]; }
    else if (live) live.parentNode.removeChild(live);
    if (!pop.hidden) { sendTheme(frame); var po = document.getElementById('pop-open'); po.href = po.href.split('#')[0] + link(t); }
  }
  function visible() { return cards.filter(function (c) { return !c.hidden; }); }
  function applyType() {
    cards.forEach(function (c) { c.hidden = !(type === 'all' || c.getAttribute('data-type') === type); });
    ty.value = type;
    var n = visible().length;
    document.getElementById('count').textContent = n + ' item' + (n === 1 ? '' : 's');
  }
  ts.addEventListener('change', function () { current = ts.value; put('design-library-theme', current); applyTheme(); });
  ty.addEventListener('change', function () { type = ty.value; put('design-library-type', type); applyType(); });
  cards.forEach(function (c) { c.querySelector('iframe').addEventListener('load', function () { sendTheme(this); }); });

  /* moving items replay when they scroll into view; never loop */
  if (window.IntersectionObserver) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) send(e.target, { replay: true }); }); }, { threshold: 0.6 });
    cards.forEach(function (c) { if (c.hasAttribute('data-moves')) io.observe(c.querySelector('iframe')); });
  }

  /* popup in the same window */
  var at = -1, opener = null;
  function show(card) {
    var it = ITEMS[+card.getAttribute('data-i')];
    at = visible().indexOf(card);
    document.getElementById('pop-id').textContent = it.id;
    document.getElementById('pop-name').textContent = it.name;
    document.getElementById('pop-type').textContent = it.type + ' · from ' + (it.from || '?');
    document.getElementById('pop-purpose').textContent = it.purpose;
    document.getElementById('pop-open').href = it.rel + link(theme());   /* opens in the theme the popup shows, font included */
    frame.title = it.id + ' ' + it.name;
    frame.onload = function () { sendTheme(frame); if (it.moves) send(frame, { replay: true, explicit: true }); };   /* opening it is the request: plays even under reduced motion */
    frame.src = it.rel;
  }
  function open(card) {
    opener = card; show(card);
    pop.hidden = false; document.body.classList.add('locked');
    document.getElementById('close').focus();
  }
  function close() {
    pop.hidden = true; document.body.classList.remove('locked'); frame.removeAttribute('src');
    var v = visible(); if (v[at]) opener = v[at];
    if (opener) opener.focus();
  }
  function step(d) { var v = visible(); if (!v.length) return; at = (at + d + v.length) % v.length; show(v[at]); }
  cards.forEach(function (c) { c.addEventListener('click', function () { open(c); }); });
  document.getElementById('close').addEventListener('click', close);
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  pop.addEventListener('click', function (e) { if (e.target === pop) close(); });
  /* Escape pressed while focus is inside the item: its engine passes the key up */
  window.addEventListener('message', function (e) { if (!pop.hidden && e.source === frame.contentWindow && e.data && e.data.escape) close(); });

    else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement !== frame && (document.activeElement === document.body || document.activeElement.closest('.tools'))) {
      e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1);   /* the item keeps its own arrow keys: Tab into it to drive its steps */
    }

      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  /* for links and checks: #open=<id> opens that item */
  var oh = (location.hash.match(/open=([A-Z]{2}-[0-9]+)/) || [])[1];
  applyTheme(); applyType();
  if (oh) { var k = ITEMS.map(function (x) { return x.id; }).indexOf(oh); if (k !== -1) { if (cards[k].hidden) { type = 'all'; applyType(); } open(cards[k]); } }
})();
