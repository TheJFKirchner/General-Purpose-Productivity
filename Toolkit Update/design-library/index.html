<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design library</title>
<style id="tokens">:root {
  --blue: #0170BC;
  --navy: #002D72;
  --green: #56A944;
  --teal: #00A9A5;
  --orange: #F68621;
  --ink: #1F2A37;
  --muted: #5B6770;
  --rule: #D9E2EA;
  --wash: #F4F8FB;
  --paper: #FFFFFF;
  --chart-muted: #C3CDD6;
  --chart-grid: #E8EDF2;
  --heading-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --body-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --heading-weight: 600;
  --good: #2E7D32;
  --bad: #B45309;
  --neutral: #8A96A0;
  --track: #E8EDF2;
  --tint: #EAF3FA;
  --shadow: #C9D4DE;
  --band: #002D72;
  --on-band: #FFFFFF;
  --menu: #FFFFFF;
  --on-menu: #002D72;
  --radius: 2px;
  --series: --blue --navy --green --teal --muted;
}</style>
<style>
  body { margin: 0; font-family: var(--body-font); color: var(--ink); background: var(--wash); }
  body.locked { overflow: hidden; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 24px; background: var(--paper); border-bottom: 1px solid var(--rule); }
  h1 { font: var(--heading-weight) 20px var(--heading-font); color: var(--navy); margin: 0 auto 0 0; }
  label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  select { font: 14px var(--body-font); color: var(--navy); background: var(--paper); border: 1.5px solid var(--navy); border-radius: var(--radius); padding: 6px 8px; min-height: 36px; }
  .count { font-size: 13px; color: var(--muted); }
  main { padding: 20px 24px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; padding: 0; cursor: pointer; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); }
  .card[hidden] { display: none; }
  .card:hover, .card:focus-visible { border-color: var(--blue); box-shadow: 3px 3px 0 var(--shadow); }
  .card:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .pv { position: relative; display: block; aspect-ratio: 16 / 9; border-bottom: 1px solid var(--rule); overflow: hidden; }
  .pv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .name { display: block; padding: 10px 12px 2px; color: var(--navy); font-size: 14px; }
  .name b, .pop .id { color: var(--blue); margin-right: 4px; }
  .purpose { display: block; padding: 0 12px 6px; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .from { display: block; padding: 0 12px 12px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  /* popup */
  .pop { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--navy) 55%, transparent); }
  .pop[hidden] { display: none; }
  .box { width: min(1180px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: var(--paper); border: 1.5px solid var(--navy); border-radius: var(--radius); padding: 14px 16px 16px; }
  .bar { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 14px; }
  .bar h2 { flex: 1 1 260px; margin: 0; font: var(--heading-weight) 18px var(--heading-font); color: var(--navy); }
  .bar .type { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools button { font: 600 14px var(--body-font); min-width: 44px; min-height: 40px; padding: 6px 12px; cursor: pointer; color: var(--navy); background: var(--paper); border: 1.5px solid var(--navy); border-radius: var(--radius); }
  .tools button:hover { background: var(--tint); }
  .about { margin: 0; font-size: 14px; color: var(--muted); }
  .about a { color: var(--blue); margin-left: 8px; font-size: 13px; white-space: nowrap; }
  .stage { position: relative; aspect-ratio: 16 / 9; width: 100%; border: 1px solid var(--rule); }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  @media (max-width: 640px) { header { padding: 10px 14px; } main { padding: 14px; } .pop { padding: 6px; } .box { padding: 10px; } .stage { aspect-ratio: 4 / 3; } }
</style></head><body>
<header>
<h1>Design library</h1>
<label>Theme <select id="theme" aria-label="Theme"></select></label>
<label>Show <select id="type" aria-label="Type of item"></select></label>
<span class="count" id="count" aria-live="polite"></span>
</header>
<main>
<div class="grid">
<button type="button" class="card" data-type="slide" data-i="0" aria-label="Preview FR-01 title">
<span class="pv"><iframe loading="lazy" src="slides/FR-01-title.html#grid" title="FR-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>FR-01</b> title</span>
<span class="purpose">Large headline, kicker above, one line below, no visual; for opening with the answer or the subject, or telling the audience who is presenting and when.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="1" aria-label="Preview FR-02 section-divider">
<span class="pv"><iframe loading="lazy" src="slides/FR-02-section-divider.html#grid" title="FR-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>FR-02</b> section-divider</span>
<span class="purpose">Section name large, one line saying what the section will show; for marking a change of topic in a longer deck, or giving the audience a breath before a new line of argument.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="2" aria-label="Preview FR-03 agenda-rows">
<span class="pv"><iframe loading="lazy" src="slides/FR-03-agenda-rows.html#grid" title="FR-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>FR-03</b> agenda-rows</span>
<span class="purpose">Numbered rows: part name and one line each; for showing the route through a longer deck, or matching what is said to the sections in the bottom bar.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="3" aria-label="Preview FR-04 goal-three-cards">
<span class="pv"><iframe loading="lazy" src="slides/FR-04-goal-three-cards.html#grid" title="FR-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>FR-04</b> goal-three-cards</span>
<span class="purpose">Three cards side by side, the third tinted; for reminding the audience of the original goal, or laying out problem, action and measure of success in one view.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="4" aria-label="Preview FR-05 statement-quote">
<span class="pv"><iframe loading="lazy" src="slides/FR-05-statement-quote.html#grid" title="FR-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>FR-05</b> statement-quote</span>
<span class="purpose">One sentence or quote in large type, source line under it; for making the audience hear one message with nothing competing, or letting a customer or stakeholder say it in their own words.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="5" aria-label="Preview EX-01 steps-flow">
<span class="pv"><iframe loading="lazy" src="slides/EX-01-steps-flow.html#grid" title="EX-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>EX-01</b> steps-flow</span>
<span class="purpose">Three to five steps on a line, each with a title and one line; for showing a method or process in order, or showing a timeline or plan with the current point marked.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="6" aria-label="Preview EX-02 data-two-cards">
<span class="pv"><iframe loading="lazy" src="slides/EX-02-data-two-cards.html#grid" title="EX-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>EX-02</b> data-two-cards</span>
<span class="purpose">Two cards: what was used (rows) and how it was checked (bullets); for showing what the analysis rests on and why it can be trusted, or answering scope and data-quality questions before they are asked.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="7" aria-label="Preview LV-01 stats-three">
<span class="pv"><iframe loading="lazy" src="slides/LV-01-stats-three.html#grid" title="LV-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-01</b> stats-three</span>
<span class="purpose">Three large figures in a row, each with a label and a comparison note, one sentence under them, no chart; for landing two or three results at once, or showing results against target or prior without a chart.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="8" aria-label="Preview LV-02 hero-number-line">
<span class="pv"><iframe loading="lazy" src="slides/LV-02-hero-number-line.html#grid" title="LV-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-02</b> hero-number-line</span>
<span class="purpose">One very large figure with its meaning in plain words, a line chart beside it; for making one number the whole message, or showing the figure and the path that led to it.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="9" aria-label="Preview LV-03 hero-number-quote">
<span class="pv"><iframe loading="lazy" src="slides/LV-03-hero-number-quote.html#grid" title="LV-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-03</b> hero-number-quote</span>
<span class="purpose">One very large figure beside a one-sentence statement; for closing on the one thing to remember, or pairing a figure with the sentence that explains it.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="10" aria-label="Preview LV-04 stats-over-bars">
<span class="pv"><iframe loading="lazy" src="slides/LV-04-stats-over-bars.html#grid" title="LV-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-04</b> stats-over-bars</span>
<span class="purpose">Three figure cards across the top, a bar chart and two bullets under; for stating a position with its two inputs and the gap between them, or showing the headline figures and how one of them has moved.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="11" aria-label="Preview LV-05 bars-highlight-commentary">
<span class="pv"><iframe loading="lazy" src="slides/LV-05-bars-highlight-commentary.html#grid" title="LV-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-05</b> bars-highlight-commentary</span>
<span class="purpose">Vertical bars with one highlighted, commentary bullets and a so-what line on the right; for showing which category stands out, or comparing a handful of groups on one measure and saying why one differs.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="12" aria-label="Preview LV-06 bars-ranked-commentary">
<span class="pv"><iframe loading="lazy" src="slides/LV-06-bars-ranked-commentary.html#grid" title="LV-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>LV-06</b> bars-ranked-commentary</span>
<span class="purpose">Sorted horizontal bars with the leader highlighted, fuller commentary on the right; for ranking items when the labels are long, or showing which item drives a result.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="13" aria-label="Preview CH-01 line-fit-commentary">
<span class="pv"><iframe loading="lazy" src="slides/CH-01-line-fit-commentary.html#grid" title="CH-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-01</b> line-fit-commentary</span>
<span class="purpose">Actual line with a dashed fitted line, commentary and so-what on the right; for showing a steady rate of change, or showing how closely actuals follow a fitted or expected path.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="14" aria-label="Preview CH-02 line-event-callout">
<span class="pv"><iframe loading="lazy" src="slides/CH-02-line-event-callout.html#grid" title="CH-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-02</b> line-event-callout</span>
<span class="purpose">Callout with one figure and three bullets on the left; two lines with an event marked on the right; for showing the effect of a change against a group that did not change, or tying a movement to the moment that caused it.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="15" aria-label="Preview CH-03 dots-two-fits">
<span class="pv"><iframe loading="lazy" src="slides/CH-03-dots-two-fits.html#grid" title="CH-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-03</b> dots-two-fits</span>
<span class="purpose">Commentary on the left; actual points with a longer and a shorter fitted line on the right; for asking whether a rate of change is speeding up or slowing, or comparing a long-run view with a recent view of the same measure.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="16" aria-label="Preview CH-04 bars-outlier-callout">
<span class="pv"><iframe loading="lazy" src="slides/CH-04-bars-outlier-callout.html#grid" title="CH-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-04</b> bars-outlier-callout</span>
<span class="purpose">One callout sentence over full-width bars with one period highlighted; for calling out an unusual period and how it was treated, or a lean slide for a senior audience: one sentence, one picture.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="17" aria-label="Preview CH-05 bars-before-after">
<span class="pv"><iframe loading="lazy" src="slides/CH-05-bars-before-after.html#grid" title="CH-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-05</b> bars-before-after</span>
<span class="purpose">Callout with the size of the change and two bullets; bars by period with the later periods highlighted; for showing a level shift after a change, or stating the size of an effect next to the evidence for it.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="18" aria-label="Preview CH-06 two-charts-bullets">
<span class="pv"><iframe loading="lazy" src="slides/CH-06-two-charts-bullets.html#grid" title="CH-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-06</b> two-charts-bullets</span>
<span class="purpose">Two small line charts side by side, one muted and one highlighted, three bullets in a row under them; for splitting a result into two measures to show which one is moving, or showing that one thing is stable while another is not.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="19" aria-label="Preview CH-07 change-cards-bars">
<span class="pv"><iframe loading="lazy" src="slides/CH-07-change-cards-bars.html#grid" title="CH-07 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CH-07</b> change-cards-bars</span>
<span class="purpose">Three stacked cards, each a change with its size and direction, beside a bar chart of the total at each review; for saying what is different since the audience last saw this, or listing a few changes with their sizes alongside the overall movement.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="20" aria-label="Preview CP-01 paired-bars-commentary">
<span class="pv"><iframe loading="lazy" src="slides/CP-01-paired-bars-commentary.html#grid" title="CP-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-01</b> paired-bars-commentary</span>
<span class="purpose">Paired bars by category (two series), commentary and so-what on the right; for comparing actual with expected across a few groups, or showing where two measures agree and where they part.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="21" aria-label="Preview CP-02 bars-target-tick">
<span class="pv"><iframe loading="lazy" src="slides/CP-02-bars-target-tick.html#grid" title="CP-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-02</b> bars-target-tick</span>
<span class="purpose">Horizontal bars with a tick marking the target for each, the miss highlighted; commentary on the right; for showing performance against a target or plan for each item, or picking out the one item that missed.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="22" aria-label="Preview CP-03 two-lines-fuller-commentary">
<span class="pv"><iframe loading="lazy" src="slides/CP-03-two-lines-fuller-commentary.html#grid" title="CP-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-03</b> two-lines-fuller-commentary</span>
<span class="purpose">Fuller commentary on the left, two lines over time on the right; for comparing our experience with a benchmark or peer, or a comparison meant to be read without a presenter.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="23" aria-label="Preview CP-04 two-lines-choice-cards">
<span class="pv"><iframe loading="lazy" src="slides/CP-04-two-lines-choice-cards.html#grid" title="CP-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-04</b> two-lines-choice-cards</span>
<span class="purpose">Two lines over time, then one card per alternative with the chosen one tinted; for showing two approaches that give different answers and which was chosen, or explaining a judgement call between two views.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="24" aria-label="Preview CP-05 dumbbell-callout">
<span class="pv"><iframe loading="lazy" src="slides/CP-05-dumbbell-callout.html#grid" title="CP-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-05</b> dumbbell-callout</span>
<span class="purpose">Full-width dumbbell chart (two points joined per category), one sentence under it; for showing movement between two points for several items at once, or showing which items moved most and in which direction.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="25" aria-label="Preview CP-06 two-numbers-difference">
<span class="pv"><iframe loading="lazy" src="slides/CP-06-two-numbers-difference.html#grid" title="CP-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-06</b> two-numbers-difference</span>
<span class="purpose">Two large figures in cards with the difference stated between them, no chart; for a before and after, or an old and new, in one glance, or when the difference is the message and a chart would add nothing.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="26" aria-label="Preview CP-07 table-key-row-commentary">
<span class="pv"><iframe loading="lazy" src="slides/CP-07-table-key-row-commentary.html#grid" title="CP-07 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-07</b> table-key-row-commentary</span>
<span class="purpose">Small table with one highlighted row, commentary and so-what beside it; for showing plan, actual and difference where exact figures will be read, or any small table where one row carries the point.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="27" aria-label="Preview CP-08 option-cards-recommendation">
<span class="pv"><iframe loading="lazy" src="slides/CP-08-option-cards-recommendation.html#grid" title="CP-08 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CP-08</b> option-cards-recommendation</span>
<span class="purpose">Two cards comparing options on the same rows, then the recommendation, no chart; for putting two options side by side on cost, benefit and risk, or leading the audience to a recommendation they can see the basis for.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="28" aria-label="Preview BD-01 waterfall-callout">
<span class="pv"><iframe loading="lazy" src="slides/BD-01-waterfall-callout.html#grid" title="BD-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-01</b> waterfall-callout</span>
<span class="purpose">Full-width vertical waterfall from one figure to another, one-sentence callout under it; for bridging from a starting figure to an ending figure by cause, or showing which driver accounts for most of a change.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="29" aria-label="Preview BD-02 waterfall-horizontal-commentary">
<span class="pv"><iframe loading="lazy" src="slides/BD-02-waterfall-horizontal-commentary.html#grid" title="BD-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-02</b> waterfall-horizontal-commentary</span>
<span class="purpose">Horizontal waterfall on the left, fuller commentary on the right; for building up a result from its components when labels are long, or a bridge that needs explaining step by step, readable without a presenter.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="30" aria-label="Preview BD-03 number-small-waterfall">
<span class="pv"><iframe loading="lazy" src="slides/BD-03-number-small-waterfall.html#grid" title="BD-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-03</b> number-small-waterfall</span>
<span class="purpose">Callout with one large figure and two bullets on the left, a three-bar waterfall on the right; for stating the effect of one decision and showing where it lands, or a simple from, change, to story.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="31" aria-label="Preview BD-04 rows-plus-bars">
<span class="pv"><iframe loading="lazy" src="slides/BD-04-rows-plus-bars.html#grid" title="BD-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-04</b> rows-plus-bars</span>
<span class="purpose">Three numbered rows on the left, the same three effects as bars on the right; for splitting a change into a few named effects, or giving each effect a sentence and showing their relative size.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="32" aria-label="Preview BD-05 stacked-mix-shift">
<span class="pv"><iframe loading="lazy" src="slides/BD-05-stacked-mix-shift.html#grid" title="BD-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-05</b> stacked-mix-shift</span>
<span class="purpose">Two 100% stacked bars, bullets and a callout under them; for showing how the make-up of a total shifted between two points, or showing that a result changed because the mix changed.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="33" aria-label="Preview BD-06 stats-over-stacked-bars">
<span class="pv"><iframe loading="lazy" src="slides/BD-06-stats-over-stacked-bars.html#grid" title="BD-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-06</b> stats-over-stacked-bars</span>
<span class="purpose">Three figures across the top, stacked horizontal bars by category, commentary beside; for splitting a total into two factors across several categories, or showing the headline figures and which category is behind them.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="34" aria-label="Preview BD-07 hero-number-donut">
<span class="pv"><iframe loading="lazy" src="slides/BD-07-hero-number-donut.html#grid" title="BD-07 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-07</b> hero-number-donut</span>
<span class="purpose">One very large figure in a callout with a two-part doughnut, no commentary; for showing that one part explains most of the whole, or a lean slide where a single share is the message.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="35" aria-label="Preview BD-08 table-bars-sensitivity">
<span class="pv"><iframe loading="lazy" src="slides/BD-08-table-bars-sensitivity.html#grid" title="BD-08 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BD-08</b> table-bars-sensitivity</span>
<span class="purpose">Small table and two bullets on the left, bars for each scenario on the right; for showing what the result becomes under different assumptions, or giving exact figures and their shape together.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="36" aria-label="Preview UN-01 range-bar-commentary">
<span class="pv"><iframe loading="lazy" src="slides/UN-01-range-bar-commentary.html#grid" title="UN-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>UN-01</b> range-bar-commentary</span>
<span class="purpose">One low-to-high range bar with the central and held figures marked, commentary under it; for showing where a chosen figure sits within a reasonable range, or making the size of the uncertainty visible.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="37" aria-label="Preview UN-02 scenario-bars-caveats">
<span class="pv"><iframe loading="lazy" src="slides/UN-02-scenario-bars-caveats.html#grid" title="UN-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>UN-02</b> scenario-bars-caveats</span>
<span class="purpose">Scenario bars on the left, four caveats and a so-what line on the right; for telling the audience what could change the answer before they decide, or sizing a few scenarios against the central view.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="38" aria-label="Preview DE-01 summary-stats-ask">
<span class="pv"><iframe loading="lazy" src="slides/DE-01-summary-stats-ask.html#grid" title="DE-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-01</b> summary-stats-ask</span>
<span class="purpose">Answer as the headline, three large figures, the ask in a strip along the bottom; for an executive summary on one slide, or giving the answer, its support and the ask together.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="39" aria-label="Preview DE-02 numbered-findings">
<span class="pv"><iframe loading="lazy" src="slides/DE-02-numbered-findings.html#grid" title="DE-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-02</b> numbered-findings</span>
<span class="purpose">Numbered rows, each a finding with its figure on the right; for listing the takeaways with their sizes, or listing risks or issues ranked by size.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="40" aria-label="Preview DE-03 audience-rows">
<span class="pv"><iframe loading="lazy" src="slides/DE-03-audience-rows.html#grid" title="DE-03 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-03</b> audience-rows</span>
<span class="purpose">One row per audience group: who, what it means for them, the one figure; for translating a result for each group in the room, or showing each team what changes for them.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="41" aria-label="Preview DE-04 scorecard-status">
<span class="pv"><iframe loading="lazy" src="slides/DE-04-scorecard-status.html#grid" title="DE-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-04</b> scorecard-status</span>
<span class="purpose">Table with a status dot per row, one row highlighted, one line under it; for giving the status of several items at a glance, or showing which item needs attention.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="42" aria-label="Preview DE-05 decision-two-paths">
<span class="pv"><iframe loading="lazy" src="slides/DE-05-decision-two-paths.html#grid" title="DE-05 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-05</b> decision-two-paths</span>
<span class="purpose">The decision in a callout, then one card for what happens if approved and one for if it waits; for asking for a decision and showing the consequence of each answer, or making the cost of delay explicit.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="43" aria-label="Preview DE-06 ask-and-actions">
<span class="pv"><iframe loading="lazy" src="slides/DE-06-ask-and-actions.html#grid" title="DE-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-06</b> ask-and-actions</span>
<span class="purpose">The decision needed in a callout on the left, rows of action, timing and owner on the right; for closing with the ask and who does what by when, or any decision followed by a short action list.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="44" aria-label="Preview DE-07 ask-and-timeline">
<span class="pv"><iframe loading="lazy" src="slides/DE-07-ask-and-timeline.html#grid" title="DE-07 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>DE-07</b> ask-and-timeline</span>
<span class="purpose">A starting point in a callout over a five-step timeline with dates and owners; for showing the sequence of work that follows a decision, or a plan where order and dates matter more than detail.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="45" aria-label="Preview BK-01 answer-with-bars">
<span class="pv"><iframe loading="lazy" src="slides/BK-01-answer-with-bars.html#grid" title="BK-01 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BK-01</b> answer-with-bars</span>
<span class="purpose">The answer as the headline; the question, a short answer and horizontal bars below; for answering a question the audience is likely to ask, or holding supporting evidence without lengthening the main story.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="slide" data-i="46" aria-label="Preview BK-02 heatmap-callout">
<span class="pv"><iframe loading="lazy" src="slides/BK-02-heatmap-callout.html#grid" title="BK-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>BK-02</b> heatmap-callout</span>
<span class="purpose">One callout sentence over a small heatmap grid with one diagonal highlighted; for showing a pattern across two dimensions, such as period by age, or pointing at one part of a grid of figures.</span>
<span class="from">slide &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="47" aria-label="Preview CT-02 bars-ranked">
<span class="pv"><iframe loading="lazy" src="charts/CT-02-bars-ranked.html#grid" title="CT-02 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-02</b> bars-ranked</span>
<span class="purpose">Use to rank items on one measure when the labels are long, or to show which item drives a result, such as PMPM trend by service category; draws horizontal bars sorted largest first, the leader in blue, values at the bar ends and the overall figure as a reference line.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="48" aria-label="Preview CT-04 line-fit">
<span class="pv"><iframe loading="lazy" src="charts/CT-04-line-fit.html#grid" title="CT-04 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-04</b> line-fit</span>
<span class="purpose">Use to show a steady rate of change, or how closely actuals follow a fitted or expected path, such as quarterly PMPM against a fitted annual trend; draws the actual line in blue, the latest period dashed as an estimate, and a dashed grey fitted line, both ends labelled.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="49" aria-label="Preview CT-06 waterfall">
<span class="pv"><iframe loading="lazy" src="charts/CT-06-waterfall.html#grid" title="CT-06 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-06</b> waterfall</span>
<span class="purpose">Use to bridge from a starting figure to an ending figure by cause, or to show which driver accounts for most of a change, such as prior to current PMPM by trend component; draws a vertical bridge with the totals dark grey, the step that matters in blue and the other steps light grey.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="50" aria-label="Preview CT-07 target-tick-bars">
<span class="pv"><iframe loading="lazy" src="charts/CT-07-target-tick-bars.html#grid" title="CT-07 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-07</b> target-tick-bars</span>
<span class="purpose">Use to show each item against its own target or plan and pick out the one item the reader must look at, a miss or a beat, such as loss ratio by product against target; draws horizontal bars with a dark tick at each target, the chosen item in blue with its value inside the bar.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="51" aria-label="Preview CT-08 dumbbell">
<span class="pv"><iframe loading="lazy" src="charts/CT-08-dumbbell.html#grid" title="CT-08 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-08</b> dumbbell</span>
<span class="purpose">Use to show movement between two points for several items at once, and which moved most and which way, such as loss ratio by product last year against this year to date; draws two dots per item joined by a short bar, the earlier grey, the later dark, the item that matters in blue.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="52" aria-label="Preview CT-10 heatmap-grid">
<span class="pv"><iframe loading="lazy" src="charts/CT-10-heatmap-grid.html#grid" title="CT-10 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-10</b> heatmap-grid</span>
<span class="purpose">Use to show a pattern across two dimensions or point at one part of a grid of figures, such as the latest diagonal of a claims development triangle; draws a small grid of figures on light grey cells, the cells that matter in blue with paper-coloured text.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="53" aria-label="Preview CT-11 range-bar">
<span class="pv"><iframe loading="lazy" src="charts/CT-11-range-bar.html#grid" title="CT-11 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-11</b> range-bar</span>
<span class="purpose">Use to show where a selected figure sits within a reasonable range and how wide the uncertainty is, such as the IBNR reserve against its low-to-high range; draws one grey bar from low to high on a value axis, the central estimate as a dashed line and the selected estimate as a solid blue line.</span>
<span class="from">chart &#183; from presentation</span></button>
<button type="button" class="card" data-type="chart" data-i="54" aria-label="Preview CT-12 year-overlay-lines">
<span class="pv"><iframe loading="lazy" src="charts/CT-12-year-overlay-lines.html#grid" title="CT-12 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-12</b> year-overlay-lines</span>
<span class="purpose">Use to read seasonality and the year-over-year gap at once, such as PMPM by incurred month for three years; draws one line per year across the calendar months, the current year in blue with its incomplete months dashed and the earlier years in greys.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="55" aria-label="Preview CT-13 product-panels">
<span class="pv"><iframe loading="lazy" src="charts/CT-13-product-panels.html#grid" title="CT-13 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-13</b> product-panels</span>
<span class="purpose">Use to compare several products over time without a tangle of lines, such as PMPM actual against expected by quarter; draws one small panel per product on a shared scale, actual against expected in each, with the A/E ratio in the panel title and the line coloured by whether it is over, under or within tolerance.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="56" aria-label="Preview CT-14 bars-rate-dual-axis">
<span class="pv"><iframe loading="lazy" src="charts/CT-14-bars-rate-dual-axis.html#grid" title="CT-14 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-14</b> bars-rate-dual-axis</span>
<span class="purpose">Use to show two measures of different units for the same groups, such as PMPM and trend by product against the pricing trend; draws two side-by-side panels on one product axis, each with its own titled value axis, and puts every group past the reference in blue in both panels.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="57" aria-label="Preview CT-15 trend-decomp-bars">
<span class="pv"><iframe loading="lazy" src="charts/CT-15-trend-decomp-bars.html#grid" title="CT-15 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-15</b> trend-decomp-bars</span>
<span class="purpose">Use to show what drives each product's trend and where the drivers offset; draws horizontal bars per product split into unit cost, utilisation and mix, increases right of zero and decreases left, a tick at the net and the net trend in a right-hand column.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="58" aria-label="Preview CT-16 development-curves">
<span class="pv"><iframe loading="lazy" src="charts/CT-16-development-curves.html#grid" title="CT-16 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-16</b> development-curves</span>
<span class="purpose">Use to show how fast claims complete and whether recent months are paying slower or faster than a complete month; draws one cumulative curve per incurral month against months of run-out, a complete month as the grey reference, recent months stopping where their data ends and the latest projected to ultimate as a dashed line.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="59" aria-label="Preview CT-17 ae-range-rows">
<span class="pv"><iframe loading="lazy" src="charts/CT-17-ae-range-rows.html#grid" title="CT-17 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-17</b> ae-range-rows</span>
<span class="purpose">Use to show actual against expected by segment over time, fairly across segments of different size; draws one row per segment with its expected range as a grey bar around 100%, the last three quarters as hollow dots, the current quarter as a dashed estimate marker, and any value outside the range as a labelled diamond in the favourable or unfavourable colour.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="60" aria-label="Preview CT-18 cost-use-bubbles">
<span class="pv"><iframe loading="lazy" src="charts/CT-18-cost-use-bubbles.html#grid" title="CT-18 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-18</b> cost-use-bubbles</span>
<span class="purpose">Use to see which service categories drive one product's trend through price, through use, or both; draws bubbles placed by change in utilisation and change in unit cost, sized by PMPM with the PMPM printed on each label, quadrant labels and a diagonal at the pricing trend, the categories past it in blue.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="61" aria-label="Preview CT-19 mix-shift-columns">
<span class="pv"><iframe loading="lazy" src="charts/CT-19-mix-shift-columns.html#grid" title="CT-19 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-19</b> mix-shift-columns</span>
<span class="purpose">Use to show how the make-up of spend changes over time, or that a result changed because the mix changed (two columns for two points), such as service category mix of PMPM; draws 100% stacked columns across several years, the shifting segment at the base in blue, the rest grey, shares inside, names at the right and the total level under each year.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="62" aria-label="Preview CT-20 target-band-lines">
<span class="pv"><iframe loading="lazy" src="charts/CT-20-target-band-lines.html#grid" title="CT-20 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-20</b> target-band-lines</span>
<span class="purpose">Use to show a rate against its target or assumption over time, such as loss ratio by product against target, or the effect of a change against a group that did not change; draws several lines against a shaded target range and a thin target line, the line that matters in blue, an event marked, the latest period dashed as an estimate and each line labelled at its end.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="63" aria-label="Preview CT-21 paid-ibnr-bars">
<span class="pv"><iframe loading="lazy" src="charts/CT-21-paid-ibnr-bars.html#grid" title="CT-21 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-21</b> paid-ibnr-bars</span>
<span class="purpose">Use for a monthly measure whose recent months are not yet complete, such as incurred PMPM with IBNR; draws bars by incurred month with the paid amount solid and the estimated unreported amount as a dashed, lighter cap, the total above each bar and last year as a dashed line.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="64" aria-label="Preview CT-22 plan-drift-steps">
<span class="pv"><iframe loading="lazy" src="charts/CT-22-plan-drift-steps.html#grid" title="CT-22 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-22</b> plan-drift-steps</span>
<span class="purpose">Use to show when a gap to budget started to open and how large it has grown; draws bars for each month's amount over or under budget, shaded by direction, with the running total as a dark step line, dashed where it includes an estimate, and its year-to-date figure and percent of budget labelled at the end.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="65" aria-label="Preview CT-23 variance-split">
<span class="pv"><iframe loading="lazy" src="charts/CT-23-variance-split.html#grid" title="CT-23 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-23</b> variance-split</span>
<span class="purpose">Use to show which groups are over or under plan and by how much, in dollars and as a percent of plan; draws horizontal bars around a zero line, over in the warning colour extending right, under in the favourable colour extending left, sorted, with the total as a last row.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="66" aria-label="Preview CT-24 pareto-bars">
<span class="pv"><iframe loading="lazy" src="charts/CT-24-pareto-bars.html#grid" title="CT-24 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-24</b> pareto-bars</span>
<span class="purpose">Use to show that a few drivers explain most of a total, such as large-claimant spend by condition; draws ranked bars with the leading few in blue, the claimant count under each name, and a running-share line on a second axis with an 80% reference.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="67" aria-label="Preview CT-27 state-tiles">
<span class="pv"><iframe loading="lazy" src="charts/CT-27-state-tiles.html#grid" title="CT-27 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-27</b> state-tiles</span>
<span class="purpose">Use to compare states fairly whatever their area, such as PMPM trend by state, without reading noise from small states; draws equal-size tiles laid out like a map of the US states, each shaded by its value in four steps of one colour, low-volume states outlined and unshaded, beside a readout of the overall, highest and lowest.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="68" aria-label="Preview CT-28 capsule-count">
<span class="pv"><iframe loading="lazy" src="charts/CT-28-capsule-count.html#grid" title="CT-28 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-28</b> capsule-count</span>
<span class="purpose">Use to show that a small share of members carries a large share of spend; draws two blocks of 100 capsules side by side, one for members and one for allowed dollars, the high-cost group in blue in both, with a large figure under each.</span>
<span class="from">chart &#183; from james-themes</span></button>
<button type="button" class="card" data-type="chart" data-i="69" aria-label="Preview CT-29 rate-buildup-bridge">
<span class="pv"><iframe loading="lazy" src="charts/CT-29-rate-buildup-bridge.html#grid" title="CT-29 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-29</b> rate-buildup-bridge</span>
<span class="purpose">Use to walk a renewal from experience to the required premium and set it against the current premium and the proposed rate action; draws a PMPM bridge through trend, plan changes, the credibility blend with manual, administration and margin, with the current and proposed premiums as reference lines.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="70" aria-label="Preview CT-30 rolling-12-panels">
<span class="pv"><iframe loading="lazy" src="charts/CT-30-rolling-12-panels.html#grid" title="CT-30 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-30</b> rolling-12-panels</span>
<span class="purpose">Use to show the run rate of a cost and its trend without the noise of single months, such as rolling 12-month PMPM and rolling 12-month trend; draws two stacked panels on one month axis, the level above and the trend percent below against the pricing trend, the months not yet complete shaded and dashed.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="71" aria-label="Preview CT-31 tornado-fan">
<span class="pv"><iframe loading="lazy" src="charts/CT-31-tornado-fan.html#grid" title="CT-31 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-31</b> tornado-fan</span>
<span class="purpose">Use to show how uncertain a projection is and which assumptions move it most, such as projected PMPM for next year; draws a sensitivity tornado of each assumption's effect on the central estimate beside a fan of the projection with 50% and 90% ranges around the dashed central line.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="72" aria-label="Preview CT-32 util-per-1000-panels">
<span class="pv"><iframe loading="lazy" src="charts/CT-32-util-per-1000-panels.html#grid" title="CT-32 preview" tabindex="-1" aria-hidden="true"></iframe></span>
<span class="name"><b>CT-32</b> util-per-1000-panels</span>
<span class="purpose">Use to compare utilisation per 1,000 members by service category against last year and a benchmark, each in its own unit; draws one small panel per category with last year and this year to date as bars, the benchmark as a line, and the change on each in the panel title, categories more than 5% over benchmark in blue.</span>
<span class="from">chart &#183; from design-library</span></button>
<button type="button" class="card" data-type="chart" data-i="73" aria-label="Preview CT-33 stop-loss-excess">
