<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* The look of this report. Colours and font are the :root block; charts read them too.
     Keep every __TOKEN__ in the body: the build fills them in. */
  :root {
    --blue: #0170BC; --navy: #002D72; --green: #56A944; --teal: #00A9A5; --orange: #F68621;
    --ink: #1F2A37; --muted: #5B6770; --rule: #D9E2EA; --wash: #F4F8FB; --paper: #FFFFFF;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --blue-light: #7FB8E0;   /* second series: a lighter --blue */
    /* chart series order: blue, blue-light, navy, teal, orange, muted (set in the script below) */
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font);
         font-variant-numeric: lining-nums; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-size: .92em; background: var(--wash); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
  .label { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); }

  /* header band */
  .top { background: var(--wash); border-top: 5px solid var(--navy); border-bottom: 1px solid var(--rule);
         padding: 34px 0 36px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-size: 32px; line-height: 1.18; margin: 8px 0 8px; color: var(--navy); font-weight: 700; max-width: 30em; }
  h1 + .answer { margin-top: 24px; }
  .question { font-size: 16.5px; color: var(--muted); margin: 0 0 26px; max-width: 48em; }

  /* the answer */
  .answer { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--blue);
            border-radius: 4px; padding: 22px 28px 22px 26px; }
  .answer .headline { font-size: 22px; line-height: 1.35; font-weight: 600; color: var(--navy); margin: 6px 0 6px; max-width: 40em; }
  .answer .basis { font-size: 13px; color: var(--muted); margin: 0; max-width: 60em; }
  .answer .bullets { margin-top: 16px; font-size: 15.5px; max-width: 56em; }

  /* figures: one row, equal width */
  .kpis { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 250px); gap: 0; }
  .answer .kpis { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .kpi { border-left: 3px solid var(--rule); padding: 2px 16px 2px 14px; }
  .kpi:first-child { border-left-color: var(--blue); }
  .kpi-value { font-size: 30px; line-height: 1.1; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kpi-label { font-size: 13px; color: var(--ink); margin-top: 4px; font-weight: 600; }
  .kpi-note { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .sec > .kpis { margin: 4px 0 22px; }
  .sec .kpi-value { font-size: 26px; }

  /* bullets */
  .bullets { list-style: none; margin: 0; padding: 0; max-width: 46em; }
  .bullets li { position: relative; padding-left: 20px; margin: 0 0 10px; }
  .bullets li:last-child { margin-bottom: 0; }
  .bullets li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; background: var(--blue); }
  .bullets strong { color: var(--navy); }
  .bullets.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 24px; max-width: none; margin-top: 22px; }
  .bullets.cols li { padding: 12px 0 0; margin: 0; border-top: 2px solid var(--navy); }
  .bullets.cols li::before { display: none; }

  /* contents */
  .contents { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 32px;
              padding: 20px 0 22px; border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.4; }
  .contents .label { grid-column: 1 / -1; color: var(--muted); }
  .contents a { color: var(--ink); display: grid; grid-template-columns: 30px minmax(0, 1fr); }
  .contents .num { color: var(--blue); font-weight: 700; }

  /* sections */
  .sec { padding: 40px 0 8px; }
  .sec + .sec { border-top: 1px solid var(--rule); margin-top: 32px; }
  .sec-head { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: start; margin-bottom: 20px; }
  .sec-head .num { font-size: 26px; line-height: 1.1; font-weight: 300; color: var(--blue); font-variant-numeric: tabular-nums; }
  h2 { font-size: 22px; line-height: 1.3; margin: 0; color: var(--navy); font-weight: 650; max-width: 38em; }
  .body.side { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: start; }
  .body.side .bullets { padding-top: 6px; font-size: 15.5px; }
  .body.stack > .bullets:not(.cols) { margin-top: 18px; }
  .body.stack > .bullets:first-child { margin-top: 0; }
  figure { margin: 0; }
  .chart-card { border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px 10px; background: var(--paper); }
  figcaption { font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 0 6px; }
  .chart { width: 100%; }
  .chart > div, .chart svg { max-width: 100%; }
  .chart-error { color: var(--muted); font-style: italic; padding: 24px 0; }
  .note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .table-card { margin-top: 26px; }
  .export { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

  /* tables */
  .tablewrap { overflow: auto; max-height: 460px; border-top: 2px solid var(--navy); }
  table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.data th { position: sticky; top: 0; background: var(--paper); text-align: left; font-weight: 600; color: var(--muted);
                  padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; cursor: pointer; user-select: none; }
  table.data td { padding: 7px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.data tbody tr:nth-child(even) td { background: var(--wash); }
  table.data .num { text-align: right; white-space: nowrap; }

  /* footer */
  footer { margin-top: 48px; background: var(--wash); border-top: 1px solid var(--rule); padding: 28px 0 40px; font-size: 13px; color: var(--muted); }
  footer h3 { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--navy); margin: 0 0 14px; }
  footer h4 { font-size: 12.5px; color: var(--ink); margin: 0 0 4px; }
  footer ul { margin: 0 0 14px; padding-left: 18px; }
  footer li { margin: 2px 0; }
  footer p { margin: 0 0 12px; }
  .foot-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 36px; }
  .foot-line { border-top: 1px solid var(--rule); padding-top: 12px; margin-top: 4px; }

  @media screen and (max-width: 820px) {
    .wrap { padding: 0 20px; }
    .body.side, .foot-grid { grid-template-columns: 1fr; gap: 22px; }
    .kpis { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
    .sec-head { grid-template-columns: 40px minmax(0, 1fr); }
  }
  @media print {
    @page { margin: 14mm 12mm; }
    body { font-size: 10.5pt; }
    .wrap { max-width: none; padding: 0; }
    .top { padding: 16px 0 18px; }
    .top .wrap, footer .wrap { padding: 0 14px; }
    .contents { display: none; }
    .sec { padding-top: 22px; }
    .sec + .sec { margin-top: 14px; }
    .sec-head, h2 { break-after: avoid; }
    .body, .chart-card, .answer, .kpis { break-inside: avoid; }
    .tablewrap { max-height: none; overflow: visible; }
    .body.side { gap: 24px; }
    .kpi-value { font-size: 24px; }
    /* charts scale to the paper width (the script sets each chart's viewBox) */
    .chart > div, .chart svg { width: 100% !important; height: 100% !important; }
    footer { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__TITLE__</h1>
    __SUBTITLE__
    __ANSWER__
  </div>
</div>
<main class="wrap">
  __CONTENTS__
  __SECTIONS__
</main>
<footer><div class="wrap">__FOOTER__</div></footer>
<script type="application/json" id="chart-options">__CHARTS__</script>
__ECHARTS__
<script>
(function () {
  var css = getComputedStyle(document.documentElement);
  function token(name) { return css.getPropertyValue('--' + name).trim(); }
  var PALETTE = ['blue', 'blue-light', 'navy', 'teal', 'orange', 'muted'].map(token);
  var INK = token('ink'), MUTED = token('muted'), RULE = token('rule'), FONT = token('font');
  var options = JSON.parse(document.getElementById('chart-options').textContent);

  // "$short" -> $4.1M, ".0%" -> 62%, ",.1f" -> 1,234.5 ; same rules as run.py
  function fmt(v, spec) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return v;
    spec = spec || ''; v = +v;
    var cur = spec.charAt(0) === '$'; if (cur) spec = spec.slice(1);
    var a = Math.abs(v), s, d = +((spec.match(/\.(\d+)/) || [0, 0])[1]);
    if (spec.indexOf('short') >= 0) {
      var u = '';
      if (a >= 1e9) { a /= 1e9; u = 'B'; } else if (a >= 1e6) { a /= 1e6; u = 'M'; } else if (a >= 1e3) { a /= 1e3; u = 'K'; }
      s = a < 10 && (u || a % 1) ? a.toFixed(1).replace(/\.0$/, '') : Math.round(a).toLocaleString('en-US');
      s += u;
    } else if (/%$/.test(spec)) {
      s = (a * 100).toFixed(d) + '%';
    } else {
      s = a.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    return (v < 0 ? '-' : '') + (cur ? '$' : '') + s;
  }
  // "@orange" anywhere in an option -> the colour token
  function tokens(o) {
    if (Array.isArray(o)) return o.map(tokens);
    if (o && typeof o === 'object') { Object.keys(o).forEach(function (k) { o[k] = tokens(o[k]); }); return o; }
    if (typeof o === 'string' && o.charAt(0) === '@' && token(o.slice(1))) return token(o.slice(1));
    return o;
  }
  function list(x) { return Array.isArray(x) ? x : (x ? [x] : []); }
  function def(obj, key, val) { if (obj[key] === undefined) obj[key] = val; return obj[key]; }
  function styleAxis(ax, f) {
    def(def(def(ax, 'axisLine', {}), 'lineStyle', {}), 'color', RULE);
    def(def(ax, 'axisTick', {}), 'show', false);
    var lab = def(ax, 'axisLabel', {}); def(lab, 'color', MUTED); def(lab, 'fontSize', 12);
    if (ax.type === 'value' && f) def(lab, 'formatter', function (v) { return fmt(v, f); });
    def(def(def(ax, 'splitLine', {}), 'lineStyle', {}), 'color', RULE);
    if (ax.type === 'category') def(ax.splitLine, 'show', false);
    var nm = def(ax, 'nameTextStyle', {}); def(nm, 'color', MUTED); def(nm, 'fontSize', 12);
  }
  function defaults(o) {
    var f = o.format || ''; delete o.format;
    o = tokens(o);
    def(o, 'color', PALETTE);
    o.animation = false;                       // steady on screen and in print
    def(o, 'textStyle', { fontFamily: FONT, color: INK });
    var series = list(o.series), cart = !!(o.xAxis || o.yAxis);
    var tip = def(o, 'tooltip', cart ? { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(1,112,188,0.06)' } } } : { trigger: 'item' });
    def(tip, 'transitionDuration', 0); def(tip, 'confine', true);
    if (f) def(tip, 'valueFormatter', function (v) { return fmt(v, f); });
    if (series.length > 1 && o.legend === undefined) o.legend = { top: 0, left: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 12, textStyle: { color: INK } };
    if (cart) {
      var hbar = list(o.yAxis).some(function (a) { return a.type === 'category'; });
      var xName = list(o.xAxis).some(function (a) { return a.name; });
      var yName = list(o.yAxis).some(function (a) { return a.name && a.type === 'value'; });
      var refLine = hbar && series.some(function (s) { return s.markLine; });  // its label sits above the plot
      def(o, 'grid', { left: 4, right: hbar ? 56 : 16, top: (o.legend ? 34 : 6) + (yName || refLine ? 26 : 8),
                       bottom: xName ? 30 : 4, containLabel: true });
      // value-axis name: above the axis for columns, centred below it for horizontal bars
      list(o.xAxis).forEach(function (a) { styleAxis(a, f); def(a, 'nameLocation', 'middle'); def(a, 'nameGap', 30); });
      list(o.yAxis).forEach(function (a) { styleAxis(a, f); def(a.nameTextStyle, 'align', 'left'); });
    }
    series.forEach(function (s) {
      def(s, 'emphasis', { disabled: true });  // no hover state: no flicker
      if (s.type === 'bar') { def(s, 'barMaxWidth', 38); def(s, 'barCategoryGap', '32%'); }
      if (s.type === 'line') { def(def(s, 'lineStyle', {}), 'width', 2.5); def(s, 'symbol', 'circle'); def(s, 'symbolSize', 6); }
      if (s.label && s.label.show) {
        def(s.label, 'color', INK); def(s.label, 'fontSize', 12);
        if (f) def(s.label, 'formatter', function (p) { return fmt(p.value && p.value.value !== undefined ? p.value.value : p.value, f); });
      }
    });
    return o;
  }

  var charts = [];
  document.querySelectorAll('[data-chart]').forEach(function (el) {
    if (typeof echarts === 'undefined') {
      el.style.height = 'auto';
      el.innerHTML = '<div class="chart-error">The chart library did not load (no internet?). Put echarts.min.js beside run.py and rebuild to embed it.</div>';
      return;
    }
    try {
      var c = echarts.init(el, null, { renderer: 'svg' });
      c.setOption(defaults(options[el.getAttribute('data-chart')]));
      var svg = el.querySelector('svg');           // lets print scale the chart to the page
      if (svg) svg.setAttribute('viewBox', '0 0 ' + el.clientWidth + ' ' + el.clientHeight);
      charts.push(c);
    } catch (e) {
      el.innerHTML = '<div class="chart-error">This chart could not be drawn: ' + e.message + '</div>';
    }
  });
  function fit() {
    charts.forEach(function (c) {
      c.resize();
      var el = c.getDom(), svg = el.querySelector('svg');
      if (svg) svg.setAttribute('viewBox', '0 0 ' + el.clientWidth + ' ' + el.clientHeight);
    });
  }
  var t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 120); });
  window.addEventListener('beforeprint', fit);
  window.addEventListener('afterprint', fit);

  // click a column heading to sort
  document.querySelectorAll('table.data').forEach(function (tb) {
    tb.querySelectorAll('th').forEach(function (th, i) {
      var asc = false;
      th.addEventListener('click', function () {
        var body = tb.tBodies[0], rows = Array.prototype.slice.call(body.rows);
        asc = !asc;
        rows.sort(function (a, b) {
          var x = a.cells[i].getAttribute('data-v'), y = b.cells[i].getAttribute('data-v');
          var nx = parseFloat(x), ny = parseFloat(y);
          var r = (!isNaN(nx) && !isNaN(ny)) ? nx - ny : x.localeCompare(y);
          return asc ? r : -r;
        });
        rows.forEach(function (r) { body.appendChild(r); });
      });
    });
  });
})();
</script>
</body>
</html>
