<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  /* The look of this analysis's report. Change fonts and colours here; charts follow.
     Keep the __TOKENS__ in the page body: the build fills them in. */
  :root {
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --page: #f4f7fb; --surface: #ffffff; --ink: #14233a; --ink-2: #44546a; --muted: #6b7a8f;
    --grid: #e3e9f1; --axis: #c2cedc; --border: #d8e1ec; --navy: #0d366b; --accent: #1c5cab; --tint: #eef4fb;
    /* chart series colours, in the order they are used */
    --s1: #1c5cab; --s2: #eb6834; --s3: #5598e7; --s4: #008300; --s5: #6250d6; --s6: #eda100;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 15px/1.55 var(--font); }
  body::before { content: ""; display: block; height: 6px; background: var(--navy); }
  main { max-width: 1080px; margin: 0 auto; padding: 36px 24px 64px; }
  .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; color: var(--navy); }
  h2 { font-size: 21px; line-height: 1.3; margin: 4px 0 6px; max-width: 46em; color: var(--navy); }
  .sec .eyebrow { color: var(--accent); font-weight: 600; }
  .q { color: var(--ink-2); margin: 0 0 12px; }
  header .q { font-size: 17px; max-width: 46em; }
  .answer { background: var(--tint); border: 1px solid var(--border); border-left: 4px solid var(--navy);
            border-radius: 8px; padding: 16px 20px; margin: 24px 0 8px; }
  .answer h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); }
  ul.commentary { margin: 0 0 4px; padding-left: 20px; max-width: 50em; }
  ul.commentary li { margin: 4px 0; }
  .answer ul.commentary { font-size: 16px; }
  .pending { color: var(--muted); font-style: italic; margin: 0 0 4px; }
  .src { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  .src summary { cursor: pointer; }
  .src p { margin: 4px 0 0; max-width: 60em; }
  .unverified { color: #b42318; font-size: 12px; }
  a { color: var(--accent); }
  .sec { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--grid); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  .card { grid-column: 1 / -1; margin: 0; background: var(--surface); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .card.half { grid-column: auto; }
  figcaption { font-weight: 600; margin-bottom: 8px; color: var(--ink); }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .export { grid-column: 1 / -1; color: var(--ink-2); font-size: 13px; margin: 0; }
  .chart { width: 100%; }
  .chart-error { color: var(--muted); font-style: italic; padding: 24px 0; }
  .tablewrap { overflow: auto; max-height: 440px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--tint); text-align: left; cursor: pointer; white-space: nowrap;
       border-bottom: 1px solid var(--axis); padding: 6px 10px; color: var(--ink-2); user-select: none; }
  th:hover { color: var(--ink); }
  td { padding: 5px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num { text-align: right; white-space: nowrap; }
  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--ink-2); font-size: 13px; }
  footer ul { padding-left: 18px; margin: 4px 0; }
  code { background: var(--tint); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 760px) { .card.half { grid-column: 1 / -1; } }
  @media print { .tablewrap { max-height: none; } .sec { break-inside: avoid; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Analysis &middot; __SLUG__ &middot; __DATE__</div>
    <h1>__TITLE__</h1>
    <p class="q">__QUESTION__</p>
    <div class="answer"><h3>The answer</h3>__ANSWER__</div>
  </header>
  __SECTIONS__
  <footer>__FOOTER__</footer>
</main>
<script type="application/json" id="chart-options">__CHARTS__</script>
__ECHARTS__
<script>
(function () {
  // colours and font come from the :root block at the top of this file
  var css = getComputedStyle(document.documentElement);
  function v(name, fallback) { return css.getPropertyValue(name).trim() || fallback; }
  var PALETTE = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6'].map(function (n) { return v(n, ''); })
    .filter(function (c) { return c; });
  if (!PALETTE.length) PALETTE = ['#1c5cab', '#eb6834'];
  var AXIS = v('--axis', '#c2cedc'), LABEL = v('--ink-2', '#44546a'), GRID = v('--grid', '#e3e9f1');
  var options = JSON.parse(document.getElementById('chart-options').textContent);

  // a string that starts with "js:" becomes a JavaScript function (for formatters)
  function revive(o) {
    if (Array.isArray(o)) return o.map(revive);
    if (o && typeof o === 'object') { Object.keys(o).forEach(function (k) { o[k] = revive(o[k]); }); return o; }
    if (typeof o === 'string' && o.indexOf('js:') === 0) return (0, eval)('(' + o.slice(3) + ')');
    return o;
  }
  function each(x, f) { if (Array.isArray(x)) x.forEach(f); else if (x) f(x); }
  function def(obj, key, val) { if (obj[key] === undefined) obj[key] = val; return obj[key]; }
  function styleAxis(ax) {
    def(def(def(ax, 'axisLine', {}), 'lineStyle', {}), 'color', AXIS);
    def(def(ax, 'axisTick', {}), 'show', false);
    def(def(ax, 'axisLabel', {}), 'color', LABEL);
    def(def(def(ax, 'splitLine', {}), 'lineStyle', {}), 'color', GRID);
    def(def(ax, 'nameTextStyle', {}), 'color', LABEL);
  }
  function defaults(o) {
    def(o, 'color', PALETTE);
    def(o, 'animationDuration', 300);
    def(o, 'textStyle', { fontFamily: v('--font', 'sans-serif') });
    var cartesian = !!(o.xAxis || o.yAxis);
    var series = Array.isArray(o.series) ? o.series : (o.series ? [o.series] : []);
    def(o, 'tooltip', cartesian ? { trigger: 'axis', axisPointer: { type: 'shadow' } } : { trigger: 'item' });
    if (series.length > 1 && o.legend === undefined) o.legend = { top: 0, type: 'scroll' };
    if (cartesian) {
      def(o, 'grid', { left: 8, right: 24, top: o.legend ? 52 : 34, bottom: 8, containLabel: true });
      each(o.xAxis, styleAxis); each(o.yAxis, styleAxis);
      // y-axis name sits above the axis, left-aligned, so long names are not cut off
      each(o.yAxis, function (ax) { if (ax.name && ax.nameLocation === undefined) def(ax.nameTextStyle, 'align', 'left'); });
    }
    series.forEach(function (s) {
      if (s.type === 'line') { def(def(s, 'lineStyle', {}), 'width', 2); def(s, 'symbolSize', 7); }
      if (s.type === 'bar') { def(s, 'barMaxWidth', 36); }
    });
    return o;
  }

  var charts = [];
  document.querySelectorAll('[data-chart]').forEach(function (el) {
    if (typeof echarts === 'undefined') {
      el.style.height = 'auto';
      el.innerHTML = '<div class="chart-error">The chart library did not load (no internet?). ' +
        'Put echarts.min.js in the analysis folder\'s _engine/ and rebuild to embed it.</div>';
      return;
    }
    try {
      var c = echarts.init(el);
      c.setOption(defaults(revive(options[el.getAttribute('data-chart')])));
      charts.push(c);
    } catch (e) {
      el.innerHTML = '<div class="chart-error">This chart could not be drawn: ' + e.message + '</div>';
    }
  });
  window.addEventListener('resize', function () { charts.forEach(function (c) { c.resize(); }); });

  // click a column heading to sort
  document.querySelectorAll('table').forEach(function (t) {
    t.querySelectorAll('th').forEach(function (th, i) {
      var asc = true;
      th.addEventListener('click', function () {
        var body = t.tBodies[0], rows = Array.prototype.slice.call(body.rows);
        rows.sort(function (a, b) {
          var x = a.cells[i].getAttribute('data-v'), y = b.cells[i].getAttribute('data-v');
          var nx = parseFloat(x), ny = parseFloat(y);
          var r = (!isNaN(nx) && !isNaN(ny) && String(nx) === x && String(ny) === y) ? nx - ny : x.localeCompare(y);
          return asc ? r : -r;
        });
        asc = !asc;
        rows.forEach(function (r) { body.appendChild(r); });
      });
    });
  });
})();
</script>
</body>
</html>
