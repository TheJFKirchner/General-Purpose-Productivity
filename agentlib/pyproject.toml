[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlib"
version = "0.1.0"
description = "Define an agent once; run it on Claude (Agent SDK) now, Cursor later."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.175",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agentlib*"]

[tool.setuptools.package-data]
agentlib = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["agentlib"]
python_files = ["test_*.py"]
# Silences pytest-asyncio's "default fixture loop scope is unset" warning (the tests do not use it, but
# it is often installed globally). Harmless when pytest-asyncio is absent apart from an unknown-key notice.
asyncio_default_fixture_loop_scope = "function"
