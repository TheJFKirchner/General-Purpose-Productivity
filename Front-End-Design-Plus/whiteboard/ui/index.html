<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design whiteboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="chat" aria-label="Chat">
    <header class="chat-head">
      <h1>Design whiteboard</h1>
      <div class="meta" id="meta">Loading...</div>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="3" placeholder="Ask for a visual, or refer to a card such as G1..."></textarea>
      <div class="composer-row">
        <span class="status" id="status"></span>
        <button type="submit" id="send" class="btn primary">Send</button>
      </div>
    </form>
  </aside>
  <main class="board">
    <div class="board-bar">
      <div class="board-title">Cards <span id="count" class="count"></span></div>
      <button type="button" id="done" class="btn">Done</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <h2>Nothing on the board yet</h2>
      <p>Describe what you want to see. The agent sees only the column names and a few sample rows, but every card is drawn on your full data. Try:</p>
      <ul id="examples"></ul>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head">
      <span class="id-badge" id="modal-id"></span>
      <span class="modal-title" id="modal-title"></span>
      <button type="button" class="btn" id="modal-close">Close</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="finished" id="finished" hidden>
  <div class="finished-box">
    <h2>Done</h2>
    <p>Your saved cards are written. You can close this tab now.</p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
