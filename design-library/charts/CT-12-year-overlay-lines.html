<!doctype html>
<!-- ITEM
id: CT-12
type: chart
name: year-overlay-lines
purpose: Use to read seasonality and the year-over-year gap at once, such as PMPM by incurred month for three years; draws one line per year across the calendar months, the current year in blue with its incomplete months dashed and the earlier years in greys.
from: design-library

  --heading-weight: 600;

  --neutral: #8A96A0;

  --shadow: #C9D4DE;
  --band: #002D72;

  --series: --blue --navy --green --teal --muted;

<p class="basis">Allowed PMPM by incurred month, paid through Oct 2026; Jul to Sep 2026 are completed with factors. Jan to Jun 2026 runs 7.2% above the same months of 2025. Sample values.</p>

- End labels replace a legend; the current year ends mid-axis, so its label is lifted with `offset`. Three years is the most that stays readable; older years go lighter and dotted so they separate in print.
